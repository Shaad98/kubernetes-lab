kind: Deployment 
apiVersion: apps/v1
metadata:
  name: nginx-depl
  namespace: nginx-ns

spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx 
  
  template:
    metadata:
      name: nginx-depl-pod
      labels:
        app: nginx
    
    spec:
      containers:
      - name: nginx
        image:  nginx:latest
        ports:
        - containerPort: 80

# kubectl scale deployment/nginx-depl -n nginx-ns --replicas=5

# kubectl get pods -n nginx-ns -o wide

